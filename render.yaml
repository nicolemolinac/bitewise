services:
  - type: web
    name: bitewise-nicole
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: REWE_REFRESH_INTERVAL_DAYS
        value: "90"
      - key: AUTO_RESTORE_LOCAL_REWE
        value: "false"
