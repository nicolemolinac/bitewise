name: Bitewise CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/complete-bitewise-mvp
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - name: Import API and verify critical routes
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/health',
              '/api/meals',
              '/api/events',
              '/api/events/dislikes',
              '/api/pantry',
              '/api/shopping',
              '/api/shopping/purchase',
              '/api/products/replace',
              '/api/rewe/refresh',
              '/api/plans',
              '/api/today',
              '/api/brain-dump',
          }
          missing = sorted(required - paths)
          assert not missing, f'Missing critical routes: {missing}'
          print(f'{app.title}: {len(paths)} routes; critical contracts OK')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build
