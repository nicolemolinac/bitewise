name: Bitewise CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/complete-bitewise-mvp
      - chatgpt/qa-bitewise
      - feat/catalog-strict-matching-costing-20261106
      - fix/ingredient-intelligence-strict-matching-20261113
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install Chromium for REWE browser fallback
        run: python -m playwright install --with-deps chromium
      - run: python -m compileall app
      - name: Compile local REWE semantic indexer
        run: python -m py_compile index_rewe_semantics.py
      - name: REWE committed catalog snapshot import QA
        run: python qa_catalog_snapshot.py
      - name: REWE catalog coverage and missing-price diagnostics
        run: python qa_catalog_coverage.py
      - name: Import API and verify critical routes
        run: |
          python - <<'PY'
          from app.server import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/health',
              '/api/meals',
              '/api/events',
              '/api/events/dislikes',
              '/api/pantry',
              '/api/shopping',
              '/api/shopping/purchase',
              '/api/products/replace',
              '/api/rewe/refresh',
              '/api/rewe/cart/add',
              '/api/plans',
              '/api/today',
              '/api/brain-dump',
              '/api/user-state',
              '/api/meal-photos',
              '/api/meal-photos/files/{filename}',
              '/api/recipe-history',
              '/api/recipe-history/{record_key:path}',
              '/api/recipe-history/reconcile',
          }
          missing = sorted(required - paths)
          assert not missing, f'Missing critical routes: {missing}'
          print(f'{app.title}: {len(paths)} routes; critical contracts OK')
          PY
      - name: End-to-end API smoke QA
        run: python qa_smoke.py
      - name: Recipe history persistence and shopping rehydration QA
        run: python qa_recipe_history.py
      - name: Selected recipe expansion regression QA
        run: python qa_recipe_expansion.py
      - name: Nested datetime serialization and repeated recipe identity QA
        run: python qa_recipe_expansion_regression.py
      - name: AI recipe output sanitization QA
        run: python qa_ai_sanitization.py
      - name: Recipe history datetime serialization QA
        run: python qa_recipe_history_datetime.py
      - name: Air fryer and microwave cooking preference QA
        run: python qa_cooking_preferences.py
      - name: REWE ingredient matching and cost QA
        run: python qa_ingredient_costing.py
      - name: Recipe ingredient intelligence and form-aware matching QA
        run: python qa_ingredient_intelligence.py
      - name: 22-recipe ingredient matching benchmark against committed REWE catalog
        env:
          BITEWISE_BENCHMARK_ISOLATED: 'true'
        run: python qa_recipe_match_benchmark.py
      - name: Local REWE semantic catalog indexing and retrieval QA
        run: python qa_semantic_catalog.py
      - name: REWE package price and multipack normalization QA
        run: python qa_rewe_price_normalization.py
      - name: REWE pagination regression QA across all 17 categories
        run: python qa_rewe_pagination.py
      - name: Google Images meal-photo API QA
        run: python qa_image_photos.py
      - name: REWE cart handoff URL safety QA
        run: python qa_rewe_cart.py
      - name: REWE product image extraction QA
        run: python qa_rewe_product_images.py
      - name: Live REWE delivery QA (manual only; GitHub-hosted runners may be blocked)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          REWE_BROWSER_ENABLED: 'true'
          REWE_BROWSER_HEADLESS: 'true'
        run: python qa_rewe_live.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from committed lockfile
        run: npm ci
      - name: Fail on high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Frontend fractional serving regression QA
        run: node --test qa/servings.test.mjs
      - name: Frontend API error handling regression QA
        run: node --test qa/apiResponse.test.mjs
      - name: Frontend REWE URL allowlist regression QA
        run: node --test qa/reweUrl.test.mjs
      - name: Capture npm audit findings without hiding them in CI logs
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('npm audit severity totals:', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via || []).map(x => typeof x === 'string' ? x : {title:x.title,url:x.url,range:x.range,severity:x.severity}),fixAvailable:v.fixAvailable}));"
      - run: npm run build
